<div class="card p-4 shadow-sm border-danger mb-4">
    <h4 class="mb-3" style="color: #8b0000;"><i class="fas fa-utensils"></i> GESTAO DE VALE ALIMENTACAO (VA)</h4>
    <div class="row g-3">
        <div class="col-12">
            <label class="form-label fw-bold">Arquivos VA (Relacao de Pedido, Boleto e Comprovante):</label>
            <input type="file" id="va_files" class="form-control" multiple accept=".pdf">
            <small class="text-muted">O sistema identificara automaticamente apenas os nomes dos colaboradores.</small>
        </div>
        <div class="col-12 mt-3">
            <button class="btn w-100 fw-bold text-white shadow" onclick="validarVA()" style="background-color: #8b0000; border: none; height: 50px;">
                Iniciar Batimento de VA
            </button>
        </div>
    </div>
    <div id="res_va" class="mt-4 d-none">
        <div class="row mb-3" id="quadro_va"></div>
        <table class="table table-hover border">
            <thead class="table-dark">
                <tr><th>Nome</th></tr>
            </thead>
            <tbody id="corpo_va"></tbody>
        </table>
        <div id="va_valores_separados" class="mt-3"></div>
    </div>
</div>

<script>
async function validarVA() {
    alert("Iniciando Processamento de VA...");
    console.log("Botao clicado");

    const filesInput = document.getElementById('va_files');
    const corpo = document.getElementById('corpo_va');
    const quadro = document.getElementById('quadro_va');
    const valoresDiv = document.getElementById('va_valores_separados');
    const resDiv = document.getElementById('res_va');

    if (!filesInput || filesInput.files.length === 0) {
        alert("Por favor, selecione os arquivos primeiro.");
        return;
    }

    if (resDiv) resDiv.classList.remove('d-none');
    corpo.innerHTML = '<tr><td class="text-center">Enviando arquivos ao servidor...</td></tr>';
    if (valoresDiv) valoresDiv.innerHTML = '';

    const formData = new FormData();
    for (let file of filesInput.files) {
        formData.append('comprovantes', file);
    }

    try {
        const resp = await fetch('/validar_va', { method: 'POST', body: formData });
        const data = await resp.json();

        console.log("Dados recebidos:", data);

        const resumo = data.resumo_financeiro || {};
        const ehComprovante = data.tipo_documento === 'comprovante_colaborador';
        const valorNf = Number(resumo.valor_nota_fiscal ?? 0);
        const somaRecibo = Number(resumo.soma_recibo ?? resumo.valor_recibo ?? 0);
        const somaComprovante = Number(resumo.soma_comprovante ?? resumo.valor_comprovante ?? 0);
        const mostrarSeparado = ehComprovante || (Array.isArray(resumo.valores_separados) && resumo.valores_separados.length > 0);
        const tituloPrincipal = mostrarSeparado ? 'SOMA RECIBOS' : 'VALOR NOTA FISCAL';
        const valorPrincipal = mostrarSeparado ? somaRecibo : valorNf;
        const competenciaLinha = resumo.competencia ? `
            <div class="col-12 mb-2">
                <div class="alert alert-secondary py-2 mb-0">
                    <strong>Competencia:</strong> ${resumo.competencia}
                </div>
            </div>` : '';

        quadro.innerHTML = `
            ${competenciaLinha}
            <div class="col-md-4 mb-2">
                <div class="p-3 border rounded text-center bg-light">
                    <small class="d-block fw-bold text-muted">SOMA EXTRAIDA</small>
                    <span class="h4">R$ ${Number(resumo.soma_colaboradores || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</span>
                </div>
            </div>
            <div class="col-md-4 mb-2">
                <div class="p-3 border rounded text-center bg-light">
                    <small class="d-block fw-bold text-muted">${tituloPrincipal}</small>
                    <span class="h4">R$ ${valorPrincipal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</span>
                </div>
            </div>
            <div class="col-md-4 mb-2">
                <div class="p-3 border rounded text-center ${resumo.conferido ? 'bg-success' : 'bg-danger'} text-white">
                    <small class="d-block fw-bold">${mostrarSeparado ? 'SOMA COMPROVANTES' : 'VALOR COMPROVANTE'}</small>
                    <span class="h4">R$ ${somaComprovante.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</span>
                </div>
            </div>`;

        const colaboradores = Array.isArray(data.colaboradores) ? data.colaboradores : [];
        const valoresSeparados = Array.isArray(resumo.valores_separados) ? resumo.valores_separados : [];
        corpo.innerHTML = "";
        if (!colaboradores.length) {
            corpo.innerHTML = '<tr><td class="text-center text-muted">Nenhum nome identificado.</td></tr>';
            return;
        }

        colaboradores.forEach((item) => {
            const nome = typeof item === 'string' ? item : (item?.nome || item?.nome_colaborador || item?.colaborador || '');
            if (!nome) return;
            corpo.innerHTML += `
                <tr>
                    <td class="fw-bold">${nome}</td>
                </tr>`;
        });

        if (valoresSeparados.length > 1) {
            valoresDiv.innerHTML = `
                <div class="border rounded p-3 bg-light">
                    <strong>Valores separados:</strong>
                    <table class="table table-sm mt-2 mb-0">
                        <thead>
                            <tr><th>Nome</th><th>Recibo</th><th>Comprovante</th><th>Status</th></tr>
                        </thead>
                        <tbody>
                            ${valoresSeparados.map((item) => `
                                <tr>
                                    <td>${item?.nome || ''}</td>
                                    <td>R$ ${Number(item?.valor_recibo || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
                                    <td>R$ ${Number(item?.valor_comprovante || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
                                    <td>${item?.status || ''}</td>
                                </tr>`).join('')}
                        </tbody>
                    </table>
                </div>`;
        }
    } catch (e) {
        console.error("Erro no fetch:", e);
        corpo.innerHTML = '<tr><td class="text-danger text-center">Erro critico na comunicacao. Verifique o console (F12).</td></tr>';
        if (valoresDiv) valoresDiv.innerHTML = '';
    }
}
</script>
