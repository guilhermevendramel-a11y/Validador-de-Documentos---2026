<div class="card p-4 shadow-sm border-danger">
    <h4 class="mb-3" style="color: #8b0000;"><i class="fas fa-shield-alt"></i> APÓLICE DO SEGURO DE VIDA</h4>
    
    <div class="row g-3">
        <div class="col-12">
            <label class="form-label fw-bold">Arquivos (Apólice + Comprovante):</label>
            <input type="file" id="seguro_files" class="form-control" multiple accept=".pdf">
            <small class="text-muted">Análise automática de empresa, período, tipo de seguro e quitação via IA.</small>
        </div>
        <div class="col-12 mt-3">
            <button class="btn w-100 fw-bold text-white shadow" onclick="validarSeguro()" style="background-color: #8b0000; border: none; height: 50px;">
                Validar Seguro de Vida
            </button>
        </div>
    </div>

    <div id="res_seguro" class="mt-4 d-none">
        <div class="alert alert-light border shadow-sm">
            <h5 class="fw-bold" id="seg_status_msg"></h5>
            <hr>
            <div class="row g-2">
                <div class="col-md-6"><strong>Empresa Identificada:</strong> <span id="seg_empresa"></span></div>
                <div class="col-md-6"><strong>Vigência/Período:</strong> <span id="seg_periodo"></span></div>
                <div class="col-md-6"><strong>Tipo de Seguro:</strong> <span id="seg_tipo"></span></div>
                <div class="col-md-6"><strong>Valor Pago (Prêmio):</strong> <span id="seg_valor"></span></div>
                <div class="col-md-12 mt-2"><strong>Análise da IA:</strong> <p id="seg_detalhe" class="small text-muted mb-0"></p></div>
            </div>
        </div>
    </div>
</div>

<script>
async function validarSeguro() {
    const filesInput = document.getElementById('seguro_files');
    if (filesInput.files.length === 0) return alert("Selecione os arquivos do Seguro.");

    const formData = new FormData();
    // 'comprovantes' é o nome que o app.py espera
    for (let f of filesInput.files) { formData.append('comprovantes', f); }

    const resDiv = document.getElementById('res_seguro');
    const msgStatus = document.getElementById('seg_status_msg');
    
    resDiv.classList.remove('d-none');
    msgStatus.className = "fw-bold text-muted";
    msgStatus.innerText = "IA processando apólice e comprovantes...";

    try {
        const resp = await fetch('/validar_seguro_vida', { method: 'POST', body: formData });
        const data = await resp.json();

        // Mapeamento dos dados vindos do app.py
        const resumo = data.resumo_financeiro;
        const validacaoPrincipal = data.validacoes[0] || { colaborador: "Não Identificado", detalhe: "Nenhum dado extraído" };

        msgStatus.className = "fw-bold text-success";
        msgStatus.innerText = "Análise Concluída com Sucesso";

        // Preenchendo os campos com os dados da IA
        document.getElementById('seg_empresa').innerText = validacaoPrincipal.colaborador; // Nome da Empresa/Seguradora
        document.getElementById('seg_periodo').innerText = "Extraído via IA"; 
        document.getElementById('seg_tipo').innerText = "Seguro de Vida em Grupo";
        document.getElementById('seg_valor').innerText = `R$ ${resumo.total_boleto.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
        document.getElementById('seg_detalhe').innerText = validacaoPrincipal.detalhe;

    } catch (e) {
        console.error(e);
        msgStatus.className = "fw-bold text-danger";
        msgStatus.innerText = "Erro técnico na validação IA.";
    }
}
</script>
