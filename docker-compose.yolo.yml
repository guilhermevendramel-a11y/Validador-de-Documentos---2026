# Servico do YOLO (validador2.portalmse.com.br), porta 8010.
# Usa uma imagem PROPRIA (Dockerfile.yolo) que estende a imagem base do servico
# "validador" e adiciona o stack de ML (torch CPU + ultralytics) para o /api/train.
# A imagem base precisa existir antes deste build (o deploy.sh garante a ordem).
# Suba sempre junto com o docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.yolo.yml up -d --build
services:
  validador-yolo:
    build:
      context: .
      dockerfile: Dockerfile.yolo
    image: validador-yolo:latest
    container_name: validador-yolo-mse
    restart: unless-stopped
    working_dir: /app
    command:
      - python
      - -c
      - "from scripts.yolo_workflow_server import app, ensure_dirs; ensure_dirs(); app.run(host='0.0.0.0', port=8010, debug=False)"
    ports:
      - "127.0.0.1:8010:8010"
    env_file:
      - .env
    volumes:
      - ./datasets:/app/datasets
      - ./models:/app/models
    mem_limit: 4g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
