services:
  validador:
    build: .
    container_name: validador-mse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # bind APENAS no localhost; o nginx faz o proxy do subdominio.
    env_file:
      - .env
    mem_limit: 2g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
